name: game-ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: game-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
      - name: Verify
        run: harness/verify.sh
